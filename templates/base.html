<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Conference Peer Review System{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="site-header">
  <div class="inner">
    <a class="site-name" href="{{ url_for('index') }}">Conference Peer Review</a>
    <nav>
      <a href="{{ url_for('index') }}"{% if request.endpoint == 'index' %} class="active"{% endif %}>Home</a>
      <a href="{{ url_for('public_search') }}"{% if request.endpoint in ('public_search', 'public_author', 'paper') %} class="active"{% endif %}>Accepted papers</a>
      <a href="{{ url_for('organizer_home') }}"{% if request.endpoint and request.endpoint.startswith('organizer') %} class="active"{% endif %}>Organizer</a>
      <a href="{{ url_for('manage') }}"{% if request.endpoint == 'manage' %} class="active"{% endif %}>Manage</a>
    </nav>
  </div>
</header>
<main class="container">
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}<div class="flash flash-{{ cat }}">{{ msg }}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
<footer class="container footer">COMS W4111 Project 1 &middot; Cecilia Yang and Ziyue Fang</footer>
</body>
</html>
