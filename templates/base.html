<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>{% block title %}Conference Peer Review System{% endblock %}</title>
<style>
  body { font-family: sans-serif; max-width: 1050px; margin: 20px auto; padding: 0 12px; line-height: 1.4; }
  table { border-collapse: collapse; margin: 8px 0 18px; }
  th, td { border: 1px solid #ccc; padding: 4px 8px; text-align: left; vertical-align: top; }
  th { background: #f3f3f3; }
  fieldset { margin: 14px 0; }
  form.inline { display: inline; }
  .ok { color: #070; } .error { color: #b00; } .muted { color: #777; } .warn { color: #b00; }
  nav a { margin-right: 14px; }
</style>
</head>
<body>
<nav>
  <a href="{{ url_for('index') }}">Home</a>
  <a href="{{ url_for('public_search') }}">Public</a>
  <a href="{{ url_for('organizer_home') }}">Organizer</a>
  <a href="{{ url_for('manage') }}">Manage people / conferences / topics</a>
</nav>
<hr>
{% with messages = get_flashed_messages(with_categories=true) %}
  {% for cat, msg in messages %}<p class="{{ cat }}"><b>{{ msg }}</b></p>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</body>
</html>
